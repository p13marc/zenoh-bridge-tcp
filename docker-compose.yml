# Example topology: one bridge exposes a backend onto the Zenoh bus, another
# imports it as a local listener. Clients connect to the importer on :8080;
# bytes flow importer -> Zenoh (peer discovery on zenoh-net) -> exporter ->
# backend. Routing spec grammar: see README "Command Line Options".
services:
  # An example TCP backend to expose (plain echo-ish HTTP server).
  backend:
    image: hashicorp/http-echo
    container_name: demo-backend
    command: ["-listen", ":8003", "-text", "hello from the bus"]
    networks:
      - zenoh-net

  # Exposes the backend onto the bus under service name 'demo'.
  bridge-backend:
    build: .
    container_name: zenoh-bridge-backend
    command:
      - --backend
      - demo/backend:8003
    networks:
      - zenoh-net
    depends_on:
      - backend
    restart: unless-stopped

  # Imports 'demo' as a local listener; auto-detects the client protocol.
  bridge-listener:
    build: .
    container_name: zenoh-bridge-listener
    ports:
      - "8080:8080"
    command:
      - --listen
      - demo/0.0.0.0:8080
    networks:
      - zenoh-net
    restart: unless-stopped

  # Optional Zenoh router, for client-mode bridges (profile: with-router).
  zenoh-router:
    image: eclipse/zenoh:latest
    container_name: zenoh-router
    ports:
      - "7447:7447"
    command:
      - --mode=router
      - --listen=tcp/0.0.0.0:7447
    networks:
      - zenoh-net
    restart: unless-stopped
    profiles:
      - with-router

  # A listener bridge in Zenoh client mode, attached to the router.
  bridge-client:
    build: .
    container_name: zenoh-bridge-client
    ports:
      - "9000:9000"
    command:
      - --listen
      - demo/0.0.0.0:9000
      - --zenoh-mode
      - client
      - --zenoh-connect
      - tcp/zenoh-router:7447
    networks:
      - zenoh-net
    depends_on:
      - zenoh-router
    restart: unless-stopped
    profiles:
      - with-router

networks:
  zenoh-net:
    driver: bridge

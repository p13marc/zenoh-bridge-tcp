[profile.default]
# Default configuration for nextest

# NO retries: every test gets a private Zenoh scouting domain (see
# `common::ScoutDomain` — each test's sessions and bridges discover only each
# other, never sibling tests' peers), which removed the cross-test multicast
# contention that made this suite flaky. A failure now is a real failure to
# investigate, not something to paper over. If CI ever flakes here, fix the
# cause; do not restore blanket retries.
retries = 0

# No test in this suite legitimately runs for minutes. Without a terminate
# bound, one test hanging on a missing response (several clients here have no
# request timeout) wedges the whole run forever; with it, the hang becomes a
# failed attempt — and with retries=0 a real, visible failure.
slow-timeout = { period = "60s", terminate-after = 3 }

# Run all tests in the http_edge_cases test binary serially
# This prevents port conflicts and Zenoh session interference
[[profile.default.overrides]]
filter = 'binary(http_edge_cases)'
threads-required = 'num-cpus'

[profile.default]
# Default configuration for nextest

# The integration suite drives real sockets + Zenoh sessions, so it is mildly
# timing-sensitive under heavy parallel load (e.g. on CI runners). Retry a failed
# test in a fresh process a couple of times; a genuine failure still fails every
# attempt, while a transient flake (a stray timeout, a teardown hiccup) recovers.
retries = 2

# Run all tests in the http_edge_cases test binary serially
# This prevents port conflicts and Zenoh session interference
[[profile.default.overrides]]
filter = 'binary(http_edge_cases)'
threads-required = 'num-cpus'

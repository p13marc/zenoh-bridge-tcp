name: CI
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # nextest: the repo requires the serial http_edge_cases override in
      # .config/nextest.toml (port/session isolation); plain `cargo test` loses it.
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: nextest (all-features)
        run: |
          set -o pipefail
          cargo nextest run --all-features --locked 2>&1 | tee /tmp/nx.txt
      - name: doctests (all-features)
        run: |
          set -o pipefail
          cargo test --doc --all-features --locked 2>&1 | tee /tmp/doc.txt  # nextest skips doctests
      # TEMP DIAGNOSTIC: this runner does not persist task logs. Surface failures
      # via a PR comment (DB-backed). Remove once the failure is identified.
      - name: report test-job failures
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          API_BASE: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOK: ${{ github.token }}
        run: |
          # Post the TAIL of each step's raw output (summaries + failure blocks),
          # ANSI stripped — grepping missed the real failure last time.
          strip() { sed -E 's/\x1b\[[0-9;]*m//g'; }
          { echo "== nextest tail =="; tail -n 45 /tmp/nx.txt 2>/dev/null | strip; echo; echo "== doctests tail =="; tail -n 45 /tmp/doc.txt 2>/dev/null | strip; } > /tmp/fails.txt || true
          python3 - <<'PY' || true
          import os, json, urllib.request
          fails = open('/tmp/fails.txt').read()[-5500:] or "(no output captured — a step may have failed before writing its file)"
          body = "### CI diagnostic — `test` job failures on the runner\n\n```\n" + fails + "\n```"
          pr, base, tok = os.environ["PR_NUMBER"], os.environ["API_BASE"], os.environ["TOK"]
          req = urllib.request.Request(f"{base}/issues/{pr}/comments",
                                       data=json.dumps({"body": body}).encode(),
                                       headers={"Authorization": f"token {tok}", "Content-Type": "application/json"},
                                       method="POST")
          try:
              urllib.request.urlopen(req, timeout=25); print("comment posted")
          except Exception as e:
              print("comment post failed:", e)
          PY

  # The h2/gRPC code is behind `tls-termination`; --all-features never compiles the
  # default build, so exercise it explicitly (clippy + tests, no features).
  default-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo nextest run --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo check --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: cargo install cargo-machete --locked && cargo machete

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo doc --all-features --no-deps --locked

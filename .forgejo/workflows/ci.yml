name: CI
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6.1.0
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6.1.0
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.1
        with:
          cache-targets: false
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6.1.0
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.1
        with:
          cache-targets: false
      - run: cargo test --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6.1.0
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/taiki-e/install-action@v2.85.7
        with:
          tool: cargo-deny
      - run: cargo deny check

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6.1.0
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: cargo install cargo-machete --locked && cargo machete

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6.1.0
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.1
        with:
          cache-targets: false
      - run: cargo doc --all-features --no-deps --locked

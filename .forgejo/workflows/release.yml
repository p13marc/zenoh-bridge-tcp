name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # re-run a failed release without deleting/re-pushing the tag. On dispatch
  # the run executes on a BRANCH ref (GITHUB_REF_NAME is e.g. "master"), so
  # every step must use the resolved RELEASE_TAG/RELEASE_SHA env instead.
  workflow_dispatch:
    inputs:
      tag:
        description: existing bare-semver tag to re-release
        required: true

env:
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_ENV"
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - name: Build release artifacts
        run: |
          mkdir -p dist/release
          name="${GITHUB_REPOSITORY#*/}"
          git archive --format=tar.gz --prefix="${name}-${RELEASE_TAG}/" \
            -o "dist/release/${name}-${RELEASE_TAG}.tar.gz" "${RELEASE_TAG}"
          # Ship a fully-featured binary: tls-termination enables --https-terminate
          # and terminated h2/gRPC routing (rustls→ring, no extra system deps).
          cargo build --release --locked --features tls-termination
          cp "target/release/${name}" "dist/release/${name}-${RELEASE_TAG}-linux-x86_64"
          (cd dist/release && sha256sum * > SHA256SUMS)
      - name: Create release if missing
        # API-driven so a workflow_dispatch re-run of an existing tag is
        # idempotent: forgejo-release@v2 tries to create and 409s when the
        # release already exists (proven by the nlink-lab 0.8.0 re-run).
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"
          if ! curl -sf -H "Authorization: token $TOKEN" "$api/releases/tags/${RELEASE_TAG}" >/dev/null; then
            curl -sf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"${RELEASE_TAG}\",\"target_commitish\":\"${RELEASE_SHA}\"}" \
              "$api/releases" >/dev/null
          fi
      - name: Attach release assets
        # delete-then-upload keeps re-runs idempotent; never override:true
        # (it recreates the release and wipes every asset)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"
          rid=$(curl -sf -H "Authorization: token $TOKEN" "$api/releases/tags/${RELEASE_TAG}" | jq -r .id)
          for f in dist/release/*; do
            name=$(basename "$f")
            for aid in $(curl -sf -H "Authorization: token $TOKEN" "$api/releases/$rid/assets" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id'); do
              curl -sf -X DELETE -H "Authorization: token $TOKEN" "$api/releases/$rid/assets/$aid" >/dev/null
            done
            curl -sf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$api/releases/$rid/assets?name=$name" >/dev/null
            echo "attached $name"
          done

  image:
    runs-on: ubuntu-24.04
    container:
      # daemonless build+push; no node inside → no JS actions in this job.
      # Pinned version (never :latest), fleet standard 2026-08-29.
      image: quay.io/buildah/stable:v1.43.2
    env:
      REGISTRY: 10.10.0.30:3000
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: vfs
    steps:
      - name: Clone release tag
        # no checkout action in this job -> resolve the tag inline
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git clone --depth 1 --branch "$tag" \
            "http://forgejo:${GITHUB_TOKEN}@10.10.0.30:3000/${GITHUB_REPOSITORY}.git" src
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          set -eu
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          cache="$REGISTRY/${GITHUB_REPOSITORY,,}-cache"
          cd src
          # revision label from the clone's HEAD: GITHUB_SHA is the branch
          # head on a workflow_dispatch re-run, not the tag commit
          revision="$(git rev-parse HEAD)"
          buildah login --tls-verify=false -u marcpardo -p "${{ secrets.REGISTRY_TOKEN }}" "$REGISTRY"

          # The layer cache lives in the SAME internal registry we just logged
          # into. It used to point at the public vhost git.marcpardo.eu, which
          # the runner zone cannot hairpin to — the same constraint the release
          # job above documents — so every tagged build died here before it
          # built anything. Pruned by the Forgejo packages cleanup rule on *-cache.
          #
          # A cache miss must never fail a release, so probe the cache first and
          # drop the flags entirely if it is not reachable.
          cache_args=""
          if buildah pull --tls-verify=false "$cache" >/dev/null 2>&1 \
            || buildah manifest inspect --tls-verify=false "$cache" >/dev/null 2>&1; then
            cache_args="--cache-from=$cache --cache-to=$cache --cache-ttl=168h"
          else
            echo "::warning::layer cache $cache unreachable; building without it"
            cache_args="--cache-to=$cache --cache-ttl=168h"
          fi

          # shellcheck disable=SC2086
          if ! buildah build --layers $cache_args --tls-verify=false \
            --label "org.opencontainers.image.source=https://git.marcpardo.eu/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${revision}" \
            -t "$image:${RELEASE_TAG}" -t "$image:latest" -f Dockerfile .; then
            echo "::warning::build with layer cache failed; retrying without it"
            buildah build --tls-verify=false \
              --label "org.opencontainers.image.source=https://git.marcpardo.eu/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${revision}" \
              -t "$image:${RELEASE_TAG}" -t "$image:latest" -f Dockerfile .
          fi

          buildah push --tls-verify=false "$image:${RELEASE_TAG}"
          buildah push --tls-verify=false "$image:latest"

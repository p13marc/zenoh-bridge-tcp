[package]
name = "zenoh-bridge-tcp"
version = "0.6.0"
edition = "2024"
# MSRV: matches flowscope's and the edition-2024 floor; enforced by the CI msrv job.
rust-version = "1.97"
license = "MIT"
authors = ["Marc Pardo <p13marc@gmail.com>"]
repository = "https://github.com/p13marc/zenoh-bridge-tcp"

[lib]
name = "zenoh_bridge_tcp"
path = "src/lib.rs"

[[bin]]
name = "zenoh-bridge-tcp"
path = "src/main.rs"

[dependencies]
zenoh = "~1.8.0"
zenoh-ext = { version = "~1.8.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
flowscope = { version = "0.23", default-features = false, features = ["http", "tls"] }
bytes = "1"
thiserror = "1"
tokio-tungstenite = "0.26"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
backon = "1"
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
# TLS termination also enables flowscope's http2 parser: terminated h2/gRPC
# routing by :authority (Phase C) is only reachable through the terminate path.
tls-termination = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pemfile",
    "flowscope/http2",
]

[dev-dependencies]
tokio-stream = "0.1"
tower = "0.4"
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
hyper = { version = "1.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webpki-roots = "0.26"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "raw_throughput"
harness = false
